<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALLMEWA | Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="signup.css">

</head>

<body>

    <div class="container">
        <div id="signup_card">
            <div id="header">
                <h1>Create an Account</h1>
                <p>Join ALLMEWA and become a member</p>
            </div>
            <form>
                <p>Full Name</p>
                <input class="input" type="text" placeholder="Enter your Full name">
                <p>Mobile Number</p>
                <input type="text" placeholder="Enter your Mobile number">
                <p>Email Address</p>
                <input type="text" placeholder="Enter your Email address">
                <p>Password</p>
                <input type="text" placeholder="Create a Password">
                <p>Confirm Password</p>
                <input type="text" placeholder="Confirm your Password">
                <p>Membership Type</p>
                <input type="text" id="browser-choice" name="browser" list="browser-options"
                    placeholder="Select Membership type">
                <datalist id="browser-options">
                    <option value="Individual">
                    <option value="Student">
                    <option value="employee">
                </datalist><br>
                <input type="checkbox">
                <label for="checkbox">I agree to the Terms & Conditions and Privacy Policy</label><br>
                <button>Sign Up</button>
                <p>or</p>
                <button>Sign Up with Google</button><br>
                <button>Sign Up with Facebook</button><br>
                <p>Already have an account</p><a href="./login.html">Login</a>
            </form>
        </div>

        <div class="wave"></div>

    </div>

</body>

</html>
