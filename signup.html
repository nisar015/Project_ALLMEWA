<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALLMEWA | Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="signup.css">

</head>

<body>

<div class="container">

    <div class="signup-card">

        <div class="logo">

            <img src="images/logo.png" alt="ALLMEWA Logo">

            <h1>ALLMEWA</h1>

            <p>ALL MINORITY EMPLOYEES WELFARE ASSOCIATION, A.P.</p>

            <span>Regd. : 631 / 2008</span>

        </div>

        <h2>Create an Account</h2>

        <p class="subtitle">
            Join ALLMEWA and become a member
        </p>

        <form>

            <div class="row">

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input type="text"
                        placeholder="Full Name">

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input type="text"
                        placeholder="Mobile Number">

                </div>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input type="email"
                    placeholder="Email Address">

            </div>

            <div class="row">

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                        placeholder="Password">

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                        placeholder="Confirm Password">

                </div>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-users"></i>

                <select>

                    <option>Select Membership Type</option>

                    <option>Government Employee</option>

                    <option>Retired Employee</option>

                    <option>Student</option>

                    <option>General Member</option>

                </select>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-location-dot"></i>

                <input type="text"
                    placeholder="District">

            </div>

            <div class="input-box">

                <i class="fa-solid fa-building"></i>

                <input type="text"
                    placeholder="Department / Office">

            </div>

            <div class="terms">

                <input type="checkbox">

                <label>

                    I agree to the

                    <a href="#">Terms & Conditions</a>

                    and

                    <a href="#">Privacy Policy</a>

                </label>

            </div>

            <button class="signup-btn">

                <i class="fa-solid fa-user-plus"></i>

                Create Account

            </button>

        </form>

        <div class="divider">

            <span>OR</span>

        </div>

        <button class="google">

            <i class="fa-brands fa-google"></i>

            Sign Up with Google

        </button>

        <button class="facebook">

            <i class="fa-brands fa-facebook"></i>

            Sign Up with Facebook

        </button>

        <p class="login">

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>

    </div>

    <div class="wave"></div>

</div>

</body>

</html>
