<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALLMEWA | Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="signup.css">

</head>

<body>

    <div class="container">
        <a href="./index.html"><img src="./images/logo.png" alt=""></a>
        <div id="signup_card">
            <div id="header">
                <h1>Create an Account</h1>
                <p>Join ALLMEWA and become a member</p>
            </div>
            <form>
                <div class="first_half">
                    <p>Full Name</p>
                    <input class="input" type="text" name="username" placeholder="Enter your Full name">    
                </div>
                <div class="sec_half">
                    <p>Mobile Number</p>
                    <input class="input" type="text" name="mobilenumber" placeholder="Enter your Mobile number">
                </div>
                <p class="clr_b">Email Address</p>
                <input class="input" type="text" name="email" placeholder="Enter your Email address">
                <div class="first_half">
                    <p>Password</p>
                    <input class="input" type="text" name="Password" placeholder="Create a Password">
                </div>
                <div class="sec_half">
                    <p >Confirm Password</p>
                    <input class="input" type="text" name="Confirmpassword" placeholder="Confirm your Password">
                </div>
                <p class="clr_b">Membership Type</p>
                <input class="input" type="text" id="browser-choice" name="browser" list="browser-options"
                    placeholder="Select Membership type">
                <datalist id="browser-options">
                    <option value="Individual">
                    <option value="Student">
                    <option value="employee">
                </datalist><br>
                <!-- <input style="margin: 13px 0 13px 5px" type="checkbox"> -->
                <label style="font-size: 13px;"><input type="checkbox" name="checkbox">I agree to the Terms & Conditions and Privacy Policy</label><br>
                <a href=""><button class="button" type="submit">Sign Up</button></a>
                <p id="or">or</p>
                <a href=""><button class="F_G">Sign Up with Google</button></a><br>
                <a href=""><button class="F_G">Sign Up with Facebook</button></a><br>
                <p id="login">Already have an account</p><a id="a_login" href="./login.html">Login</a>
            </form>
        </div>

        <div class="wave"></div>

    </div>

</body>

</html>
