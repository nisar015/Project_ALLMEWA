<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLMEWA Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="container">
        <a href="./index.html"><img src="./images/logo.png" alt=""></a>
        <div id="login_card">
            <div id="heading">
                <h1>Welcome Back!</h1>
                <p>Login to your ALLMEWA account</p>
            </div>
            <form action="http://127.0.0.1:5000/login" method="POST">
                <p>Email address / Mobile number</p>
                <input type="email" name="email" placeholder="Enter your Email" required><br>
                <!-- <input type="text" class="input" name="username" placeholder="Enter username"><br> -->
                <p>Password</p>
                <input type="password" name="password" placeholder="Enter your Password" required><br>
                <!-- <input type="text" class="input" name="username" placeholder="Enter Password"><br> -->
                <a style="float: right;" href=".Forgot Password.html">Forgot Password</a><br>
                <!-- <input id="checkbox" value="checkbox" type="checkbox"> -->
                <label><input type="checkbox">Remember Me</label><br>
                <a href=""><button class="button">Login</button></a>
                <p class="pp">or</p>
                <a href=""><button class="F_G">Continue with Google</button></a>
                <a href=""><button class="F_G">Continue with Facebook</button></a>
                <p class="p">Don't have an account ? <a href="./signup.html">Signup</a></p>
            </form>
        </div>
        <div class="wave"></div>

    </div>

</body>

</html>
